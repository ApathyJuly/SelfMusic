server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: selfmusic-server
  # 不指定 profile 时默认走 dev；生产用 SPRING_PROFILES_ACTIVE=prod 显式激活
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      data-source-properties:
        useUnicode: true
        characterEncoding: utf8
        serverTimezone: UTC
        allowPublicKeyRetrieval: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:2GB}
      max-request-size: ${MAX_REQUEST_SIZE:2GB}
      file-size-threshold: 2MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
