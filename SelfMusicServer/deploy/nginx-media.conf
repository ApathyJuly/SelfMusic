# SelfMusic MinIO 媒体入口示例
#
# 目标：
#   App --预签名 GET/PUT--> Nginx --> MinIO
#
# S3_PUBLIC_ENDPOINT 必须与这里对外暴露的地址一致，例如：
#   https://media.example.com
#
# 注意：音频桶是私有的，预签名 URL 自带过期签名。
# Nginx 不应对 / 做 proxy_cache，否则可能绕过签名过期校验，
# 把已过期 URL 对应的对象继续返回。重复播放的缓存交给 Android 的
# PlaybackCache（5GB LRU）；如果要 CDN 缓存，请使用能校验签名的 CDN。

server {
    listen 443 ssl http2;
    server_name media.example.com;

    ssl_certificate     /etc/letsencrypt/live/media.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.example.com/privkey.pem;

    # 音频上传，与后端 MAX_AUDIO_SIZE 保持一致
    client_max_body_size 2g;

    location / {
        # 同机部署；如果 Nginx 在 Docker 里，改成 http://minio:9000
        proxy_pass http://127.0.0.1:9000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 播放：不要等 Nginx 缓冲满再发首字节
        proxy_buffering off;

        # 直传：不要先把整个音频写到 Nginx 临时文件
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# 如果不想使用独立域名，也可以复用现有 HTTPS 域名，只代理 bucket 路径。
# 此时 S3_PUBLIC_ENDPOINT 填 https://你的域名（根路径），不要带 /selfmusic。
