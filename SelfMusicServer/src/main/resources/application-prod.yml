# 生产环境：所有敏感值必须由环境变量注入，不提供任何开发用兜底值
# 启动方式：SPRING_PROFILES_ACTIVE=prod（Docker Compose 已配置）
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TTL:PT30M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
  media:
    token-secret: ${MEDIA_TOKEN_SECRET}
    token-ttl: ${MEDIA_TOKEN_TTL:PT6H}
    cover-token-ttl: ${MEDIA_COVER_TTL:P7D}
  storage:
    type: s3
    s3:
      endpoint: ${S3_ENDPOINT}
      public-endpoint: ${S3_PUBLIC_ENDPOINT}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      bucket: ${S3_BUCKET}
      path-style: ${S3_PATH_STYLE:true}
      create-bucket: ${S3_CREATE_BUCKET:false}
