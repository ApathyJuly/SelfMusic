# 开发环境：默认读取项目根目录的 .env.local，覆盖下面的兜底值
spring:
  config:
    import: optional:file:./.env.local[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/selfmusic}
    username: ${DB_USER:selfmusic}
    password: ${DB_PASSWORD:}

app:
  # 仅开发环境使用的占位密钥，生产必须由环境变量注入
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
    access-token-ttl: ${JWT_ACCESS_TTL:PT30M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
  media:
    token-secret: ${MEDIA_TOKEN_SECRET:dev-only-media-secret-change-me-0123456789abcdef}
    token-ttl: ${MEDIA_TOKEN_TTL:PT6H}
    cover-token-ttl: ${MEDIA_COVER_TTL:P7D}
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root: ${LOCAL_STORAGE_ROOT:./data/uploads}
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      bucket: ${S3_BUCKET:selfmusic}
      path-style: ${S3_PATH_STYLE:true}
      create-bucket: ${S3_CREATE_BUCKET:true}
