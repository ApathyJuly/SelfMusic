# /etc/nginx/sites-available/selfmusic.conf
# 用法：把 music.example.com 换成你的域名，然后
#   sudo ln -s /etc/nginx/sites-available/selfmusic.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前提：证书已存在（先执行 certbot certonly --standalone -d 你的域名），
# 否则 nginx -t 会因为找不到 pem 文件而失败。
#
# 说明：compose 里的 server 只监听 127.0.0.1:8080，对外的入口就是这里。
# 媒体直连：/selfmusic/ 反向代理到 MinIO 9000，对应 S3_PUBLIC_ENDPOINT=https://music.example.com

# ---------- 80：只做跳转 + 给 certbot 验证用 ----------
server {
    listen 80;
    listen [::]:80;
    server_name music.example.com;

    # Let's Encrypt 续期验证，必须放在跳转之前
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：真正的业务入口 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name music.example.com;

    ssl_certificate     /etc/letsencrypt/live/music.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 歌曲上传上限默认 2GB，必须 >= 后端的 MAX_FILE_SIZE，否则上传直接 413
    # 注意：值会进 nginx 内存分配，别随手写 100g
    client_max_body_size 2048m;
    client_body_timeout  3600s;

    access_log /var/log/nginx/selfmusic.access.log;
    error_log  /var/log/nginx/selfmusic.error.log;

    # MinIO 媒体入口（预签名 URL 直连）。
    # S3_PUBLIC_ENDPOINT 填 https://music.example.com（根路径），
    # 预签名 URL 的路径是 /selfmusic/...，这里不要改写路径，否则签名失效。
    location /selfmusic/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 播放不要缓冲首字节；上传不要先落 Nginx 临时文件
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        # 大文件上传：不要让 nginx 先把整个文件缓存到磁盘再转发
        proxy_request_buffering off;

        # 音频流式播放/下载是长连接，默认 60s 会被掐断
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 健康检查不写访问日志，避免刷日志
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
